<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kiosk Fullscreen YouTube</title>
<style>
html,body {
height:100%; margin:0; background:#000; overflow:hidden;
}
iframe {
position:fixed; top:0; left:0; width:100vw; height:100vh; border:0;
}
</style>
</head>
<body>
<script>
// Video ID
const VIDEO_ID = "kou9yRSpVOY";


// Kiosk fullscreen embed URL (autoplay, loop, no controls)
const kioskUrl = `https://www.youtube.com/embed/${VIDEO_ID}?autoplay=1&controls=0&loop=1&mute=1&playlist=${VIDEO_ID}&modestbranding=1&rel=0&playsinline=1`;


// Insert iframe
const iframe = document.createElement("iframe");
iframe.src = kioskUrl;
iframe.allow = "autoplay; fullscreen";
document.body.appendChild(iframe);


// Auto‑reload every 4 hours to avoid any freeze
setInterval(() => location.reload(), 4 * 60 * 60 * 1000);
</script>
</body>
</html>
